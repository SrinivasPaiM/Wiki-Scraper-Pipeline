name: WikiScraper Daily

on:
  schedule:
    - cron: '0 4 * * *'   # 4 AM UTC
    - cron: '0 12 * * *'  # 12 PM UTC
    - cron: '0 20 * * *'  # 8 PM UTC
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Decide if Scraper Should Run Today and Handle Repo Index
        run: |
          python3 <<'EOF'
          import json, random, datetime, sys
          from pathlib import Path

          state_file = Path("scraper/state.json")
          today = datetime.datetime.utcnow().strftime("%Y-%m-%d")

          # Load existing state.json
          with open(state_file, "r") as f:
              state = json.load(f)

          # Initialize or reset daily run tracking
          if "last_run_date" not in state or state["last_run_date"] != today:
              state["last_run_date"] = today
              state["runs_today"] = 0
              state["max_runs_today"] = random.randint(1, 3)

          # Check if today's limit reached
          if state["runs_today"] >= state["max_runs_today"]:
              print(f"Skipping run: already ran {state['runs_today']} times (max {state['max_runs_today']})")
              with open(state_file, "w") as f:
                  json.dump(state, f, indent=2)
              sys.exit(0)

          # Increment today's counter
          state["runs_today"] += 1
          print(f"Proceeding: run #{state['runs_today']} of {state['max_runs_today']} for {today}")

          # Check if we need to start a new repo
          FILE_LIMIT = 150
          if state.get("current_file_number", 0) >= FILE_LIMIT:
              state["repo_index"] = state.get("repo_index", 1) + 1
              state["current_file_number"] = 0
              print(f"File limit reached. Incrementing repo_index to {state['repo_index']} and resetting current_file_number.")

          # Save updated state.json
          with open(state_file, "w") as f:
              json.dump(state, f, indent=2)
          EOF

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}-${{ hashFiles('scraper/playwright_browsers.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install crawl4ai requests playwright
          playwright install --with-deps

      - name: Run Scraper
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: python scraper/main.py

      - name: Push Scraped Data to Correct Repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          sudo apt-get update && sudo apt-get install -y jq

          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

          REPO_INDEX=$(jq '.repo_index' scraper/state.json)
          TARGET_REPO="wikiscraper-$(printf "%03d" $REPO_INDEX)"
          echo " Target repo is: $TARGET_REPO"

          mkdir temp_data_repo
          cd temp_data_repo

          echo " Cloning https://github.com/${{ github.repository_owner }}/${TARGET_REPO}.git ..."
          git clone https://${{ secrets.GH_TOKEN }}@github.com/${{ github.repository_owner }}/${TARGET_REPO}.git .

          cp -r ../scraper/scraped_data/* . 2>/dev/null || true

          git add .
          git commit -m "🗂Daily scrape update: $(date -u +'%Y-%m-%d %H:%M:%S')" || echo " Nothing new to commit"
          git push || echo "Push failed, check token and repo permissions"

      - name: 🔄 Push updated state.json back to main repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

          echo " Updating state.json in main repo..."
          cd "$GITHUB_WORKSPACE"

          git checkout main
          git pull origin main

          echo " Git status before commit:"
          git status

          git add scraper/state.json
          git commit -m " Update state.json after scrape" || echo " Nothing to commit"
          git push origin main || echo " Push failed for state.json"
